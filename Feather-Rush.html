<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feather Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e8e8; --fg:#242424; --accent:#777; --accent-2:#b7b7b7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#202020;--fg:#e6e6e6;--accent:#a0a0a0;--accent-2:#5d5d5d}}
:root[data-theme="dark"]{--bg:#202020;--fg:#e6e6e6;--accent:#a0a0a0;--accent-2:#5d5d5d}
html,body{height:100%;margin:0}
body{
  background:var(--fg);color:var(--fg);
  font-family:"Archivo Black","Arial Black",Impact,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
#wrap{position:relative;height:100%;max-height:760px;aspect-ratio:2/3;max-width:100%;background:var(--bg)}
canvas{width:100%;height:100%;display:block;background:var(--bg)}
#topControls{position:absolute;z-index:3;top:12px;right:12px;display:flex;gap:6px}
#topControls button{height:38px;min-width:38px;padding:6px 9px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);font:700 12px system-ui,Arial,sans-serif;cursor:pointer;touch-action:manipulation}
#soundToggle svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#soundToggle .slash{display:none}#soundToggle.muted .slash{display:block}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.panel{pointer-events:auto;background:var(--bg);color:var(--fg);border:4px solid var(--fg);box-shadow:8px 8px 0 var(--fg);padding:22px 24px;width:min(84%,340px);box-sizing:border-box;max-height:92%;overflow-y:auto}
.panel h1{margin:0;font-size:clamp(2rem,8vw,3rem);line-height:.95;letter-spacing:-.05em;font-weight:400;white-space:nowrap}
.panel h2{margin:0 0 12px;font-size:2rem;line-height:1;font-weight:400;letter-spacing:-.02em}
.panel p,.panel label{font:500 .95rem/1.35 system-ui,"Helvetica Neue",Arial,sans-serif}
.panel p{margin:10px 0 0}
.panel label{display:block;margin:20px 0 6px;font-weight:700}
.sub{margin:10px 0 0}
input{width:100%;box-sizing:border-box;font:400 1.1rem "Archivo Black","Arial Black",sans-serif;padding:11px 12px;border:3px solid var(--fg);background:var(--bg);color:var(--fg);border-radius:0;user-select:text;-webkit-user-select:text}
input:focus-visible,.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.err{min-height:1.2em;margin:6px 0 0!important;font-weight:700!important}
.btn{display:block;width:100%;box-sizing:border-box;font:400 1.1rem "Archivo Black","Arial Black",sans-serif;text-align:center;padding:12px 14px;margin-top:14px;border:3px solid var(--fg);border-radius:0;background:var(--bg);color:var(--fg);box-shadow:5px 5px 0 var(--fg);cursor:pointer}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--fg)}
.row{display:flex;gap:12px}.row .btn{margin-top:14px}
.big{font-size:4.2rem;line-height:1;margin:4px 0 0}
#list{list-style:none;margin:0;padding:0;border-top:3px solid var(--fg)}
#list li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:8px;padding:8px 6px;border-bottom:2px solid var(--fg);font-size:1rem;align-items:baseline}
#list li .n{opacity:.55}
#list li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list li.me{background:var(--fg);color:var(--bg)}
#list li.me .n{opacity:.7}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="600"></canvas>
  <div id="topControls">
    <button id="languageToggle" type="button" aria-label="Change language" title="Change language">EN</button>
    <button id="soundToggle" type="button" aria-label="Sound on" title="Sound on" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/><path class="slash" d="m4 4 16 16"/></svg>
    </button>
  </div>
  <div id="overlay">
    <section class="panel" id="menu">
      <h1>Feather Rush</h1>
      <p class="sub" id="tagline"></p>
      <label for="nick" id="nickLabel"></label>
      <input id="nick" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="err" id="err" role="alert"></p>
      <button class="btn primary" id="play"></button>
      <button class="btn" id="toBoard"></button>
      <p id="instructions"></p>
    </section>

    <section class="panel hidden" id="board">
      <h2 id="boardTitle"></h2>
      <ol id="list"></ol>
      <p id="boardNote"></p>
      <button class="btn" id="boardBack"></button>
    </section>

    <section class="panel hidden" id="over">
      <h2 id="overTitle"></h2>
      <p id="scoreLabel" style="margin-top:0"></p>
      <div class="big" id="finalScore">0</div>
      <p id="overBest"></p>
      <p id="overNote"></p>
      <button class="btn primary" id="again"></button>
      <div class="row">
        <button class="btn" id="overBoard"></button>
        <button class="btn" id="overMenu"></button>
      </div>
    </section>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=400,H=600,GROUND=60,TAU=Math.PI*2;
const GRAV=0.26,FLAP=-5.9,SPEED=3.15,GAP=160,PIPE_W=62,SPACING=230;
const cs=getComputedStyle(document.documentElement);
let BG='#e8e8e8',FG='#242424',ACCENT='#777',ACCENT2='#b7b7b7';
const $=id=>document.getElementById(id);
const TEXT={
  en:{tagline:'Fly between the columns. One mistake and it’s over.',nickname:'Your nickname',nickPlaceholder:'2–14 characters',play:'Play',top:'Top 10',instructions:'Flap: Space, click, or tap.',boardTitle:'All-time Top 10',back:'Back',over:'Game over',score:'Your score',again:'Play again',menu:'Menu',tap:'Tap to flap',nickError:'Enter a nickname with at least 2 characters.',empty:'No scores yet. Play a round and set the first record!',local:'Scores are saved only in this browser.',noName:'Anonymous',newRecord:'New personal best!',best:'Your best: {score}',saveError:'Could not save the score in this browser.',saved:'Score added to the local leaderboard.',soundOn:'Sound on',soundOff:'Sound off',changeLanguage:'Change language',languageName:'English'},
  uk:{tagline:'Летіть між колонами. Одна помилка — і кінець.',nickname:'Ваш нікнейм',nickPlaceholder:'Від 2 до 14 символів',play:'Грати',top:'Топ-10',instructions:'Змах крил: пробіл, клік або дотик.',boardTitle:'Топ-10 за весь час',back:'Назад',over:'Кінець гри',score:'Ваш рахунок',again:'Ще раз',menu:'Меню',tap:'Торкніться, щоб злетіти',nickError:'Введіть нікнейм від 2 символів.',empty:'Поки порожньо. Зіграйте й встановіть перший рекорд!',local:'Рейтинг зберігається лише в цьому браузері.',noName:'Без імені',newRecord:'Новий особистий рекорд!',best:'Ваш рекорд: {score}',saveError:'Не вдалося зберегти результат у цьому браузері.',saved:'Результат записано до локального рейтингу.',soundOn:'Увімкнути звук',soundOff:'Вимкнути звук',changeLanguage:'Змінити мову',languageName:'Українська'},
  de:{tagline:'Flieg zwischen den Säulen hindurch. Ein Fehler und es ist vorbei.',nickname:'Dein Spitzname',nickPlaceholder:'2–14 Zeichen',play:'Spielen',top:'Top 10',instructions:'Flügelschlag: Leertaste, klicken oder tippen.',boardTitle:'Top 10 aller Zeiten',back:'Zurück',over:'Spiel vorbei',score:'Dein Punktestand',again:'Nochmal spielen',menu:'Menü',tap:'Tippen zum Fliegen',nickError:'Gib einen Spitznamen mit mindestens 2 Zeichen ein.',empty:'Noch keine Punkte. Spiele eine Runde und setze den ersten Rekord!',local:'Die Rangliste wird nur in diesem Browser gespeichert.',noName:'Anonym',newRecord:'Neuer persönlicher Rekord!',best:'Dein Rekord: {score}',saveError:'Der Punktestand konnte nicht in diesem Browser gespeichert werden.',saved:'Punktestand zur lokalen Rangliste hinzugefügt.',soundOn:'Ton einschalten',soundOff:'Ton ausschalten',changeLanguage:'Sprache ändern',languageName:'Deutsch'}
};
let language='en',lastNewBest=false,lastOverNoteKey='';
try{const savedLanguage=localStorage.getItem('swift-language');if(TEXT[savedLanguage])language=savedLanguage}catch(e){}
function applyLanguage(){
  const t=TEXT[language];document.documentElement.lang=language;$('languageToggle').textContent=language.toUpperCase();
  $('languageToggle').title=t.changeLanguage+': '+t.languageName;$('languageToggle').setAttribute('aria-label',t.changeLanguage+': '+t.languageName);
  $('tagline').textContent=t.tagline;$('nickLabel').textContent=t.nickname;$('nick').placeholder=t.nickPlaceholder;
  $('play').textContent=t.play;$('toBoard').textContent=t.top;$('instructions').textContent=t.instructions;
  $('boardTitle').textContent=t.boardTitle;$('boardBack').textContent=t.back;$('overTitle').textContent=t.over;
  $('scoreLabel').textContent=t.score;$('again').textContent=t.again;$('overBoard').textContent=t.top;$('overMenu').textContent=t.menu;
  if($('err').textContent)$('err').textContent=t.nickError;
  if(state==='dead'){
    const finalScore=Number($('finalScore').textContent)||0;
    $('overBest').textContent=lastNewBest&&finalScore>0?t.newRecord:t.best.replace('{score}',String(best));
    $('overNote').textContent=lastOverNoteKey?t[lastOverNoteKey]:'';
  }
  renderBoard();updateSoundButton();
}
let best=0,nick='';
try{best=parseInt(localStorage.getItem('swift-best'))||0;nick=localStorage.getItem('swift-nick')||''}catch(e){}
$('nick').value=nick;
let bird,pipes,score,state='menu',frame=0,deadTimer=0,prevPanel='menu',lastTime=0;
let audioCtx=null,soundOn=true;
try{soundOn=localStorage.getItem('swift-sound')!=='off'}catch(e){}

function audio(){
  if(!soundOn)return null;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
  }catch(e){return null;}
}
function tone(freq,endFreq,duration,when=0,wave='sine',volume=.045){
  const a=audio();if(!a)return;
  const start=a.currentTime+when,osc=a.createOscillator(),gain=a.createGain();
  osc.type=wave;osc.frequency.setValueAtTime(freq,start);osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),start+duration);
  gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.008);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
  osc.connect(gain);gain.connect(a.destination);osc.start(start);osc.stop(start+duration+.02);
}
function flapSound(){tone(520,260,.075,0,'triangle',.035)}
function scoreSound(){tone(660,880,.09,0,'sine',.04);tone(880,1180,.12,.075,'sine',.035)}
function dieSound(){tone(300,90,.28,0,'triangle',.055)}
function updateSoundButton(){
  const label=soundOn?TEXT[language].soundOff:TEXT[language].soundOn;
  $('soundToggle').classList.toggle('muted',!soundOn);$('soundToggle').setAttribute('aria-pressed',String(soundOn));
  $('soundToggle').setAttribute('aria-label',label);$('soundToggle').title=label;
}

const FAR=[[40,60],[30,90],[50,50],[36,110],[44,70],[30,40],[50,100],[40,60],[40,80],[40,50]];
const NEAR=[[60,40],[34,70],[46,30],[50,90],[30,50],[56,36],[44,64],[40,44],[40,26]];

/* ---------- panels ---------- */
function show(id){
  ['menu','board','over'].forEach(p=>$(p).classList.toggle('hidden',p!==id));
  if(id)prevPanel=id;
}
function hideAll(){['menu','board','over'].forEach(p=>$(p).classList.add('hidden'))}

/* ---------- leaderboard (local to this browser) ---------- */
const SCORES_KEY='swift-scores';
let rows=[];
function loadScores(){
  try{
    const saved=JSON.parse(localStorage.getItem(SCORES_KEY)||'[]');
    return Array.isArray(saved)?saved.filter(r=>r&&typeof r.name==='string'&&Number.isFinite(Number(r.best))).map(r=>({name:r.name.slice(0,14),best:Number(r.best)})).sort((a,b)=>b.best-a.best).slice(0,10):[];
  }catch(e){return [];}
}
function renderBoard(){
  const list=$('list');list.textContent='';
  rows.forEach((r,i)=>{
    const li=document.createElement('li');
    if(r.name===nick)li.className='me';
    const n=document.createElement('span');n.className='n';n.textContent=(i+1)+'.';
    const nm=document.createElement('span');nm.className='nm';nm.textContent=String(r.name||TEXT[language].noName).slice(0,14);
    const sc=document.createElement('span');sc.textContent=Number(r.best)||0;
    li.append(n,nm,sc);list.append(li);
  });
  const note=$('boardNote');
  if(!rows.length)note.textContent=TEXT[language].empty;
  else note.textContent=TEXT[language].local;
}
function submit(sc){
  try{
    rows=loadScores();
    const existing=rows.find(r=>r.name.toLocaleLowerCase()===nick.toLocaleLowerCase());
    if(existing)existing.best=Math.max(existing.best,sc);
    else rows.push({name:nick,best:sc});
    rows.sort((a,b)=>b.best-a.best);
    rows=rows.slice(0,10);
    localStorage.setItem(SCORES_KEY,JSON.stringify(rows));
    return true;
  }catch(e){return false;}
}

/* ---------- game ---------- */
function resetBird(){
  bird={x:100,y:H/2-GROUND/2,vy:0,r:11,rot:0};
  pipes=[];score=0;
}
function addPipe(x){
  const min=70,max=H-GROUND-GAP-70;
  pipes.push({x,top:min+Math.random()*(max-min),passed:false});
}
function startRun(){resetBird();state='ready';hideAll();}
function flap(){
  if(state==='ready'){state='play';addPipe(W+40);}
  if(state==='play'){bird.vy=FLAP;flapSound();}
  else if(state==='dead'&&deadTimer<=0)startRun();
}
async function die(){
  state='dead';deadTimer=40;dieSound();
  const newBest=score>best;
  lastNewBest=newBest;lastOverNoteKey='';
  if(newBest){best=score;try{localStorage.setItem('swift-best',best)}catch(e){}}
  $('finalScore').textContent=score;
  $('overBest').textContent=newBest&&score>0?TEXT[language].newRecord:TEXT[language].best.replace('{score}',String(best));
  $('overNote').textContent='';
  show('over');
  const ok=submit(score);
  if(!ok){lastOverNoteKey='saveError';$('overNote').textContent=TEXT[language].saveError;}
  else if(newBest&&score>0){lastOverNoteKey='saved';$('overNote').textContent=TEXT[language].saved;}
}
function update(step){
  frame+=step;
  if(state==='menu'||state==='ready'){bird.y=H/2-GROUND/2+Math.sin(frame/25)*6;return;}
  if(deadTimer>0)deadTimer=Math.max(0,deadTimer-step);
  if(state==='play'){
    bird.vy+=GRAV*step;bird.y+=bird.vy*step;
    bird.rot=Math.max(-0.4,Math.min(1.1,bird.vy/5));
    pipes.forEach(p=>p.x-=SPEED*step);
    if(pipes.length&&pipes[pipes.length-1].x<W-SPACING)addPipe(W+40);
    if(pipes.length&&pipes[0].x<-PIPE_W-10)pipes.shift();
    for(const p of pipes){
      if(!p.passed&&p.x+PIPE_W<bird.x){p.passed=true;score++;scoreSound()}
      const inX=bird.x+bird.r>p.x-4&&bird.x-bird.r<p.x+PIPE_W+4;
      if(inX&&(bird.y-bird.r+1<p.top||bird.y+bird.r-1>p.top+GAP)){die();return;}
    }
    if(bird.y+bird.r>H-GROUND){bird.y=H-GROUND-bird.r;die();return;}
    if(bird.y-bird.r<0){bird.y=bird.r;bird.vy=0;}
  }else if(state==='dead'){
    if(bird.y+bird.r<H-GROUND){bird.vy+=GRAV*2*step;bird.y+=bird.vy*step;bird.rot=Math.min(1.5,bird.rot+.05*step);}
    else bird.y=H-GROUND-bird.r;
  }
}

/* ---------- drawing ---------- */
function skyline(arr,speed,alpha){
  const off=(frame*speed)%W;
  ctx.globalAlpha=alpha;ctx.fillStyle=FG;
  for(let rep=0;rep<2;rep++){
    let x=rep*W-off;
    for(const [w,h] of arr){ctx.fillRect(x,H-GROUND-h-40,w-2,h+40);x+=w;}
  }
  ctx.globalAlpha=1;
}
function hatch(x,y,w,h,step){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.strokeStyle=FG;ctx.lineWidth=2;ctx.beginPath();
  for(let i=-h;i<w+h;i+=step){ctx.moveTo(x+i,y+h);ctx.lineTo(x+i+h,y);}
  ctx.stroke();ctx.restore();
}
function drawPipe(p,y,h,flip){
  const x=p.x;
  ctx.fillStyle=ACCENT2;ctx.fillRect(x,y,PIPE_W,h);
  hatch(x+PIPE_W*.55,y,PIPE_W*.45,h,7);
  ctx.strokeStyle=FG;ctx.lineWidth=4;ctx.strokeRect(x,y,PIPE_W,h);
  const capY=flip?y+h-24:y;
  ctx.fillStyle=FG;ctx.fillRect(x-6,capY,PIPE_W+12,24);
  ctx.fillStyle=BG;
  const ly=flip?capY+16:capY+6;ctx.fillRect(x+4,ly,PIPE_W-8,2);
}
function drawBird(){
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  const f=state==='play'?Math.sin(frame/(bird.vy<0?2:5))*8:Math.sin(frame/10)*3;
  ctx.fillStyle=FG;ctx.strokeStyle=BG;ctx.lineWidth=2;ctx.lineJoin='miter';
  const pts=[[-20,-8],[-8,-6],[5,-9],[22,-2],[7,2],[-3,7],[-10,2],[-20,3],[-14,-2]];
  ctx.beginPath();pts.forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b));ctx.closePath();
  ctx.fill();ctx.stroke();
  ctx.fillStyle=BG;ctx.strokeStyle=FG;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(2,-2);ctx.lineTo(-17,-9+f*1.6);ctx.lineTo(-8,5);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=BG;ctx.fillRect(8,-6,3,3);
  ctx.restore();
}
function label(txt,y,size){
  ctx.font=size+'px "Archivo Black","Arial Black",Impact,sans-serif';ctx.textAlign='center';
  ctx.lineJoin='round';ctx.lineWidth=8;ctx.strokeStyle=BG;ctx.strokeText(txt,W/2,y);
  ctx.fillStyle=FG;ctx.fillText(txt,W/2,y);
}
function draw(){
  BG=cs.getPropertyValue('--bg').trim()||BG;FG=cs.getPropertyValue('--fg').trim()||FG;
  ACCENT=cs.getPropertyValue('--accent').trim()||ACCENT;ACCENT2=cs.getPropertyValue('--accent-2').trim()||ACCENT2;
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=ACCENT2;
  [[84,3],[62,1.5],[40,1.5]].forEach(([r,w])=>{ctx.lineWidth=w;ctx.beginPath();ctx.arc(290,150,r,0,TAU);ctx.stroke();});
  ctx.fillStyle=ACCENT;ctx.beginPath();ctx.arc(290,150,16,0,TAU);ctx.fill();
  ctx.strokeStyle=ACCENT;ctx.globalAlpha=.38;ctx.lineWidth=2;
  for(let i=0;i<6;i++){
    const y=60+i*58+(i%2)*14,len=30+(i*37)%50,x=((i*131-frame*(1+i*.15))%(W+120)+W+120)%(W+120)-60;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+len,y);ctx.stroke();
  }
  ctx.globalAlpha=1;
  skyline(FAR,.25,.08);skyline(NEAR,.6,.16);
  pipes.forEach(p=>{drawPipe(p,0,p.top,true);drawPipe(p,p.top+GAP,H-GROUND-p.top-GAP,false);});
  ctx.fillStyle=FG;ctx.fillRect(0,H-GROUND,W,GROUND);
  ctx.fillStyle=BG;
  const off=(state==='play'?frame*SPEED:frame*.4)%32;
  for(let x=-32;x<W+32;x+=32){
    ctx.beginPath();ctx.moveTo(x-off,H-GROUND+18);ctx.lineTo(x-off+16,H-GROUND+18);
    ctx.lineTo(x-off+8,H-GROUND+36);ctx.lineTo(x-off-8,H-GROUND+36);ctx.closePath();ctx.fill();
  }
  drawBird();
  if(state==='dead'){ctx.globalAlpha=.25;ctx.fillStyle=FG;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(state==='play'||state==='dead')label(score,84,56);
  if(state==='ready'){label(nick,60,20);label(TEXT[language].tap,H/2+90,18);}
}
function loop(now){
  const elapsed=lastTime?Math.min(now-lastTime,50):1000/60;
  lastTime=now;
  update(elapsed/(1000/60));draw();requestAnimationFrame(loop);
}

/* ---------- events ---------- */
function tryPlay(){
  const v=$('nick').value.replace(/\s+/g,' ').trim().slice(0,14);
  if(v.length<2){$('err').textContent=TEXT[language].nickError;$('nick').focus();return;}
  nick=v;$('err').textContent='';
  try{localStorage.setItem('swift-nick',nick)}catch(e){}
  startRun();
}
$('play').onclick=tryPlay;
$('topControls').addEventListener('pointerdown',e=>e.stopPropagation());
$('languageToggle').onclick=()=>{language=language==='en'?'uk':language==='uk'?'de':'en';try{localStorage.setItem('swift-language',language)}catch(e){}applyLanguage();};
$('soundToggle').onclick=e=>{e.stopPropagation();soundOn=!soundOn;try{localStorage.setItem('swift-sound',soundOn?'on':'off')}catch(err){}updateSoundButton();if(soundOn)tone(700,700,.05,0,'sine',.025);};
$('nick').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryPlay();}});
$('nick').addEventListener('input',()=>{$('err').textContent=''});
$('toBoard').onclick=()=>{renderBoard();show('board');$('boardBack').dataset.to='menu';};
$('overBoard').onclick=()=>{renderBoard();show('board');$('boardBack').dataset.to='over';};
$('boardBack').onclick=()=>show($('boardBack').dataset.to||'menu');
$('again').onclick=()=>{if(deadTimer<=0)startRun();};
$('overMenu').onclick=()=>{state='menu';resetBird();show('menu');};
addEventListener('keydown',e=>{
  if(state==='menu'||e.target.tagName==='INPUT')return;
  if(e.code==='Space'||e.code==='ArrowUp'){
    if(state==='dead'&&!$('board').classList.contains('hidden'))return;
    e.preventDefault();flap();
  }
});
$('wrap').addEventListener('pointerdown',e=>{
  if(e.target.closest('.panel')||e.target.closest('#topControls')||state==='menu')return;
  e.preventDefault();flap();
});

rows=loadScores();resetBird();show('menu');applyLanguage();loop();renderBoard();
</script>
</body>
</html>
