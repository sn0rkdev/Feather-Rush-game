<style>
:root{
  --bg:#e8e8e8; --fg:#242424; --accent:#777; --accent-2:#b7b7b7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-palette="color"]{--bg:#e9e5dc;--fg:#55595d;--accent:#8298a2;--accent-2:#c4bba9}
:root[data-theme="dark"]{--bg:#202020;--fg:#e6e6e6;--accent:#a0a0a0;--accent-2:#5d5d5d}
:root[data-theme="dark"][data-palette="color"]{--bg:#292d30;--fg:#d8d7d0;--accent:#92a6ad;--accent-2:#656d70}
@media (prefers-color-scheme: dark){:root[data-theme="system"]:not([data-palette="color"]){--bg:#202020;--fg:#e6e6e6;--accent:#a0a0a0;--accent-2:#5d5d5d}:root[data-theme="system"][data-palette="color"]{--bg:#292d30;--fg:#d8d7d0;--accent:#92a6ad;--accent-2:#656d70}}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:"Archivo Black","Arial Black",Impact,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
#wrap{position:relative;flex:0 0 auto;width:min(100vw,calc(100svh * 2 / 3),506.67px);height:auto;aspect-ratio:2/3;background:var(--bg)}
canvas{width:100%;height:100%;display:block;background:var(--bg)}
#topControls{position:absolute;z-index:3;top:12px;right:12px;display:flex;gap:7px}
#topControls button{height:40px;min-width:40px;padding:6px 9px;border:1px solid color-mix(in srgb,var(--fg) 22%,transparent);border-radius:13px;background:color-mix(in srgb,var(--bg) 68%,transparent);color:var(--fg);font:700 11px system-ui,Arial,sans-serif;box-shadow:0 5px 18px #0002,inset 0 1px 0 #ffffff75;backdrop-filter:blur(14px) saturate(135%);-webkit-backdrop-filter:blur(14px) saturate(135%);cursor:pointer;touch-action:manipulation;transition:transform .16s,box-shadow .16s}
#topControls button:hover{transform:translateY(-1px);box-shadow:0 8px 22px #0003,inset 0 1px 0 #ffffff9c}
#soundToggle svg,#musicToggle svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#soundToggle .slash,#musicToggle .slash{display:none}#soundToggle.muted .slash,#musicToggle.muted .slash{display:block}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.panel{pointer-events:auto;background:color-mix(in srgb,var(--bg) 72%,transparent);color:var(--fg);border:1px solid color-mix(in srgb,var(--fg) 24%,transparent);border-radius:21px;box-shadow:0 24px 65px #0003,inset 0 1px 0 #ffffff80,0 0 30px color-mix(in srgb,var(--fg) 9%,transparent);padding:22px 24px;width:min(84%,340px);box-sizing:border-box;max-height:92%;overflow-y:auto;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.panel h1{margin:0;font-size:clamp(2rem,8vw,3rem);line-height:.95;letter-spacing:-.05em;font-weight:400;white-space:nowrap;text-shadow:0 0 2px currentColor,0 0 12px color-mix(in srgb,var(--fg) 38%,transparent),0 0 27px color-mix(in srgb,var(--fg) 20%,transparent)}
.panel h2{margin:0 0 12px;font-size:2rem;line-height:1;font-weight:400;letter-spacing:-.02em;text-shadow:0 0 2px currentColor,0 0 12px color-mix(in srgb,var(--fg) 36%,transparent),0 0 24px color-mix(in srgb,var(--fg) 18%,transparent)}
.panel p,.panel label{font:500 .95rem/1.35 system-ui,"Helvetica Neue",Arial,sans-serif}
.panel p{margin:10px 0 0}
.panel label{display:block;margin:20px 0 6px;font-weight:700}
.sub{margin:10px 0 0}
input{width:100%;box-sizing:border-box;font:400 1.1rem "Archivo Black","Arial Black",sans-serif;padding:11px 12px;border:1px solid color-mix(in srgb,var(--fg) 32%,transparent);background:color-mix(in srgb,var(--bg) 62%,transparent);color:var(--fg);border-radius:11px;box-shadow:inset 0 2px 8px #00000010;backdrop-filter:blur(10px);user-select:text;-webkit-user-select:text}
input:focus-visible,.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.err{min-height:1.2em;margin:6px 0 0!important;font-weight:700!important}
.btn{display:block;width:100%;box-sizing:border-box;font:400 1.1rem "Archivo Black","Arial Black",sans-serif;text-align:center;padding:12px 14px;margin-top:14px;border:1px solid color-mix(in srgb,var(--fg) 24%,transparent);border-radius:12px;background:color-mix(in srgb,var(--bg) 62%,transparent);color:var(--fg);box-shadow:0 7px 20px #00000016,inset 0 1px 0 #ffffff75;backdrop-filter:blur(12px) saturate(130%);cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s}
.btn:hover{transform:translateY(-2px);box-shadow:0 11px 25px #00000020,inset 0 1px 0 #ffffff9c}
.btn.primary{background:color-mix(in srgb,var(--fg) 88%,transparent);color:var(--bg);box-shadow:0 7px 22px color-mix(in srgb,var(--fg) 30%,transparent),inset 0 1px 0 #ffffff35}
.btn:active{transform:translateY(1px);box-shadow:0 3px 10px #0002}
.row{display:flex;gap:12px}.row .btn{margin-top:14px}
.shop-cards{display:grid;gap:9px;margin-top:14px}
.skin-card{display:grid;grid-template-columns:48px 1fr;gap:4px 10px;align-items:center;padding:10px;border:1px solid color-mix(in srgb,var(--fg) 20%,transparent);border-radius:14px;background:color-mix(in srgb,var(--bg) 58%,transparent);box-shadow:inset 0 1px 0 #ffffff50}
.skin-preview{grid-row:span 2;width:46px;height:42px;display:grid;place-items:center}
.skin-preview::before{content:"";display:block;width:35px;height:19px;background:var(--fg);clip-path:polygon(0 30%,28% 22%,56% 18%,78% 38%,100% 50%,76% 66%,50% 82%,27% 70%,0 76%)}
.skin-preview.round::before{clip-path:none;border-radius:45% 38% 35% 42%;box-shadow:inset 0 0 0 2px var(--bg)}
.skin-preview.pixel::before{width:36px;height:24px;clip-path:none;border-radius:0;background:linear-gradient(var(--fg) 0 0) 6px 0/18px 6px no-repeat,linear-gradient(var(--fg) 0 0) 0 6px/30px 12px no-repeat,linear-gradient(var(--fg) 0 0) 6px 18px/18px 6px no-repeat,linear-gradient(var(--accent) 0 0) 30px 9px/6px 6px no-repeat}
.skin-card h3{margin:0;font:700 .95rem/1.1 system-ui,Arial,sans-serif}
.skin-card p{margin:3px 0 0;font:400 .78rem/1.25 system-ui,Arial,sans-serif;opacity:.78}
.skin-card .btn{grid-column:1/-1;margin-top:7px;padding:9px 10px;font-size:.9rem}
.skin-card .btn:disabled{opacity:.62;cursor:default;transform:none}
.shop-wallet{font-weight:700}
.big{font-size:4.2rem;line-height:1;margin:4px 0 0;text-shadow:0 0 3px currentColor,0 0 15px color-mix(in srgb,var(--fg) 42%,transparent),0 0 30px color-mix(in srgb,var(--fg) 22%,transparent)}
#list{list-style:none;margin:0;padding:0;border-top:3px solid var(--fg)}
#list li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:8px;padding:8px 6px;border-bottom:2px solid var(--fg);font-size:1rem;align-items:baseline}
#list li .n{opacity:.55}
#list li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list li.me{background:var(--fg);color:var(--bg)}
#list li.me .n{opacity:.7}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="600"></canvas>
  <div id="topControls">
    <button id="languageToggle" type="button" aria-label="Change language" title="Change language">EN</button>
    <button id="paletteToggle" type="button" aria-label="Switch palette" title="Switch palette">B&amp;W</button>
    <button id="themeToggle" type="button" aria-label="Change theme" title="Change theme">AUTO</button>
    <button id="musicToggle" type="button" aria-label="Music on" title="Music on" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13M9 8l12-2"/><ellipse cx="5" cy="18" rx="4" ry="3"/><ellipse cx="17" cy="16" rx="4" ry="3"/><path class="slash" d="m3 3 18 18"/></svg>
    </button>
    <button id="soundToggle" type="button" aria-label="Sound on" title="Sound on" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/><path class="slash" d="m4 4 16 16"/></svg>
    </button>
  </div>
  <div id="overlay">
    <section class="panel" id="menu">
      <h1>Feather Rush</h1>
      <p class="sub" id="tagline"></p>
      <label for="nick" id="nickLabel"></label>
      <input id="nick" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="err" id="err" role="alert"></p>
      <button class="btn primary" id="play"></button>
      <button class="btn" id="shopOpen"></button>
      <button class="btn" id="toBoard"></button>
      <p id="instructions"></p>
    </section>

    <section class="panel hidden" id="shop">
      <h2 id="shopTitle"></h2>
      <p class="shop-wallet" id="shopWallet"></p>
      <p id="shopStatus" role="status"></p>
      <div class="shop-cards" id="shopCards"></div>
      <button class="btn" id="shopBack"></button>
    </section>

    <section class="panel hidden" id="board">
      <h2 id="boardTitle"></h2>
      <ol id="list"></ol>
      <p id="boardNote"></p>
      <button class="btn" id="boardBack"></button>
    </section>

    <section class="panel hidden" id="over">
      <h2 id="overTitle"></h2>
      <p id="scoreLabel" style="margin-top:0"></p>
      <div class="big" id="finalScore">0</div>
      <p id="overCoins"></p>
      <p id="overBest"></p>
      <p id="overNote"></p>
      <button class="btn primary" id="again"></button>
      <div class="row">
        <button class="btn" id="overBoard"></button>
        <button class="btn" id="overMenu"></button>
      </div>
    </section>
  </div>
</div>

function audio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==='suspended')audioCtx.resume();

}

function drawCoins(){coins.forEach(c=>drawCoin(c.x,c.y,c.phase,9));}
function drawBirdTrail(){

  pixelTrail.forEach(p=>{
    ctx.save();ctx.globalAlpha=Math.max(0,p.life)*alpha;ctx.fillStyle=frame%2?ACCENT:FG;

function drawPipe(p,y,h,flip){

function drawBird(){
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  const f=state==='play'?Math.sin(frame/(bird.vy<0?2:5))*8:Math.sin(frame/10)*3;
  if(selectedSkin==='pixel'){
    ctx.fillStyle=FG;[[-15,-6,21,12],[-11,-9,14,18],[2,-6,9,12],[-20,-3,7,6],[9,-2,9,4]].forEach(r=>ctx.fillRect(...r));

    ctx.fillStyle=BG;ctx.fillRect(-8,-2,10,5);ctx.fillRect(8,-6,3,3);ctx.fillRect(1,-8+Math.round(f/4),5,3);
    ctx.restore();return;

    ctx.moveTo(-20,-2);ctx.quadraticCurveTo(-21,-8,-14,-9);ctx.lineTo(3,-9);ctx.quadraticCurveTo(10,-9,15,-5);ctx.lineTo(22,-2);ctx.lineTo(13,2);ctx.quadraticCurveTo(9,8,2,8);ctx.lineTo(-13,6);ctx.quadraticCurveTo(-20,6,-20,-2);ctx.closePath();
  }else{pts.forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b));ctx.closePath();}

function label(txt,y,size){

  ctx.lineJoin='round';ctx.lineWidth=8;ctx.strokeStyle=BG;ctx.strokeText(txt,W/2,y);

  ctx.fillStyle=FG;ctx.strokeStyle=BG;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(24,0);ctx.lineTo(8,-3);ctx.lineTo(-12,-14);ctx.lineTo(-18,-12);ctx.lineTo(-10,-2);ctx.lineTo(-25,-1);ctx.lineTo(-29,0);ctx.lineTo(-25,1);ctx.lineTo(-10,2);ctx.lineTo(-18,12);ctx.lineTo(-12,14);ctx.lineTo(8,3);ctx.closePath();ctx.fill();ctx.stroke();

function drawFlyby(){
  if(cameoAt<0&&score>=nextCameoScore){cameoAt=frame;nextCameoScore+=20;cameoHitPlayed=false;}
  if(cameoAt<0)return;
  const t=(frame-cameoAt)/110,y=174+Math.sin(t*6)*4,cx=200,cy=y;
  if(t>1){cameoAt=-1;return;}

function draw(){

  const glowMid=dark?(colored?'rgba(150,188,194,.13)':'rgba(225,225,225,.12)'):(colored?'rgba(245,215,165,.15)':'rgba(215,215,215,.10)');

  if(dark){ctx.fillStyle=BG;ctx.beginPath();ctx.arc(298,143,15,0,TAU);ctx.fill();}

function loop(now){
  const elapsed=lastTime?Math.min(now-lastTime,50):1000/60;
  lastTime=now;
  update(elapsed/(1000/60));draw();requestAnimationFrame(loop);
}

/* ---------- events ---------- */
function tryPlay(){
  const v=$('nick').value.replace(/\s+/g,' ').trim().slice(0,14);
  if(v.length<2){$('err').textContent=TEXT[language].nickError;$('nick').focus();return;}
  nick=v;$('err').textContent='';
  try{localStorage.setItem('swift-nick',nick)}catch(e){}
  startMusic();
  startRun();
}
$('play').onclick=tryPlay;
$('wrap').addEventListener('click',e=>{if(e.target.closest('button'))uiClickSound()},true);
$('topControls').addEventListener('pointerdown',e=>e.stopPropagation());
$('languageToggle').onclick=()=>{language=language==='en'?'uk':language==='uk'?'de':'en';try{localStorage.setItem('swift-language',language)}catch(e){}applyLanguage();};
$('paletteToggle').onclick=()=>{palette=palette==='mono'?'color':'mono';try{localStorage.setItem('swift-palette',palette)}catch(e){}updateAppearance();};
$('themeToggle').onclick=()=>{theme=theme==='system'?'light':theme==='light'?'dark':'system';try{localStorage.setItem('swift-theme',theme)}catch(e){}updateAppearance();};
$('musicToggle').onclick=e=>{e.stopPropagation();musicOn=!musicOn;try{localStorage.setItem('swift-music',musicOn?'on':'off')}catch(err){}updateMusicButton();if(musicOn)startMusic();else stopMusic();};
$('soundToggle').onclick=e=>{e.stopPropagation();soundOn=!soundOn;try{localStorage.setItem('swift-sound',soundOn?'on':'off')}catch(err){}updateSoundButton();if(soundOn)tone(700,700,.05,0,'sine',.025);};
$('nick').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryPlay();}});
$('nick').addEventListener('input',()=>{$('err').textContent=''});
$('toBoard').onclick=()=>{show('board');$('boardBack').dataset.to='menu';refreshBoard();};
$('shopOpen').onclick=()=>{$('shopStatus').textContent='';renderShop();show('shop');};
$('shopBack').onclick=()=>show('menu');
$('overBoard').onclick=()=>{show('board');$('boardBack').dataset.to='over';refreshBoard();};
$('boardBack').onclick=()=>show($('boardBack').dataset.to||'menu');
$('again').onclick=()=>{if(deadTimer<=0)startRun();};
$('overMenu').onclick=()=>{state='menu';resetBird();show('menu');};
addEventListener('keydown',e=>{
  if(state==='menu'||e.target.tagName==='INPUT')return;
  if(e.code==='Space'||e.code==='ArrowUp'){
    if(state==='dead'&&!$('board').classList.contains('hidden'))return;
    e.preventDefault();flap();
  }
});
$('wrap').addEventListener('pointerdown',e=>{
  if(e.target.closest('.panel')||e.target.closest('#topControls')||state==='menu')return;
  e.preventDefault();flap();
});

rows=loadLocalScores();resetBird();show('menu');applyLanguage();loop();renderBoard();
